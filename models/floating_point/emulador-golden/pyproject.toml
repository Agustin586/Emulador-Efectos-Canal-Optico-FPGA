[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emulador-golden"
version = "0.1.0"
description = "Golden models en punto flotante del emulador de efectos de canal óptico en FPGA"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
notebooks = ["jupyterlab>=4", "ipykernel", "jupytext>=1.16", "nbstripout", "nbconvert"]

[tool.setuptools.packages.find]
include = ["emulador*"]

[tool.setuptools.package-data]
emulador = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
